name: Build FPS Game
permissions:
  contents: read
  actions: write
on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt update && sudo apt install -y build-essential git libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev
      - name: Fetch raylib 5.5
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
      - name: Compile Linux CPU and OpenGL GPU builds
        run: RAYLIB_SOURCE_DIR="$RUNNER_TEMP/raylib" sh ./build.sh release
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: fps_game-linux
          path: |
            .build/bin/fps_ray
            .build/bin/fps_ray_gpu
            .build/bin/fps_ray_cpu
            .build/bin/shaders

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2 and dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: |
            git
            make
            mingw-w64-ucrt-x86_64-gcc
      - name: Fetch raylib 5.5
        shell: msys2 {0}
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
      - name: Compile Windows CPU and OpenGL GPU builds
        shell: powershell
        run: ./build.ps1 -RaylibSource "$env:RUNNER_TEMP/raylib" -ToolchainBin "C:\msys64\ucrt64\bin" -Configuration release
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: fps_game-win
          path: |
            .build/bin/fps_ray.exe
            .build/bin/fps_ray_gpu.exe
            .build/bin/fps_ray_cpu.exe
            .build/bin/shaders

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch raylib 5.5
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
      - name: Validate shared GPU layout
        run: python3 tools/validate_gpu_layout.py
      - name: Compile native macOS game and Metal physics
        run: |
          export RAYLIB_SOURCE_DIR="$RUNNER_TEMP/raylib"
          sh ./build-macos.sh release native
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: fps_game-mac
          path: |
            .build/bin/fps_ray
            .build/bin/fps_ray_gpu
            .build/bin/fps_ray_cpu
            .build/bin/shaders
            .build/FPS Game.app
